name: ChasingManga
options:
  minimumXcodeGenVersion: 2.46.0
  createIntermediateGroups: true
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
packages:
  ChasingManga:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '2'
targets:
  MangaIOS:
    type: application
    platform: iOS
    sources: [Apps/iOS]
    dependencies:
      - package: ChasingManga
        product: MangaUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chasingmanga.local.ios
        INFOPLIST_FILE: Apps/iOS/Info.plist
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
  MangaMac:
    type: application
    platform: macOS
    sources: [Apps/macOS]
    dependencies:
      - package: ChasingManga
        product: MangaUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chasingmanga.local.mac
        INFOPLIST_FILE: Apps/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/MangaMac.entitlements
        ENABLE_APP_SANDBOX: YES
  MangaIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Apps/UITests]
    dependencies:
      - target: MangaIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chasingmanga.local.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
  MangaMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Apps/UITests]
    dependencies:
      - target: MangaMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chasingmanga.local.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MangaIOS:
    build:
      targets:
        MangaIOS: all
    test:
      targets: [MangaIOSUITests]
  MangaMac:
    build:
      targets:
        MangaMac: all
    test:
      targets: [MangaMacUITests]
